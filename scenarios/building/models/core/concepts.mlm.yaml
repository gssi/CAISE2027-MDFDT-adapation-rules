# O2: generic concepts, shared by every DT and independent of any domain.
#   requiresSource  instances need a value source: runtime data or another DT
#   dependent       instances are evaluated from other elements
#   device          instances are physical devices, reached through a connector
#   sensor          instances are sensors on a device: what they sense provides data
#   actuator        instances are parts of a device that only act
#   reaction        instances invoke an operation when a condition on what they observe becomes true
# What a sensor or an actuator can be asked to do are the operations of its class.
#
# The relations between concepts say which references a DT type may state: a
# reference between two classes is an instance of a relation between their
# concepts. They are all optional (no lowerBound).
level: O2
ePackage: core
eClasses:
  Entity:
    eReferences:
      parts: { eType: Entity, upperBound: -1, containment: true }
  Observation:
    requiresSource: true
    eReferences:
      source: { eType: Entity }
      sensor: { eType: Sensor }
  Indicator:
    dependent: true
    eReferences:
      inputs: { eType: Observation, upperBound: -1 }
  Goal:
    dependent: true
    eReferences:
      indicator: { eType: Indicator, upperBound: -1 }
  Rule:
    dependent: true
    eReferences:
      inputs: { eType: Observation, upperBound: -1 }
  Device: { device: true }
  Sensor:
    sensor: true
    eReferences:
      device: { eType: Device }
  Actuator:
    actuator: true
    eReferences:
      device: { eType: Device }
  Reaction:
    dependent: true
    reaction: true
    eReferences:
      input: { eType: Observation }
      actuator: { eType: Actuator }
      sensor: { eType: Sensor }
