# Walk step 4b: the instance follows the type. The people counter feeds occupied; the reactions test the count.
level: O0
name: room1
dt: Room 1
objects:
  presence:
    instanceOf: Presence
  occupancy:
    instanceOf: Occupancy
    bindings:
      occupied: count
    source: presence
  simulated_device:
    instanceOf: SimulatedDevice
    connector: simulated
  presence2:
    instanceOf: PresenceSensor
    bindings:
      detected: detected
    kind: presence
    device: simulated_device
    uid: presence
    value: "true"
  switch:
    instanceOf: Switch
    bindings:
      on: on
    kind: switch
    device: simulated_device
    uid: indicator
  occupied_set:
    instanceOf: OccupiedSet
    input: occupancy
    target: switch
    when: occupied > 0
    operation: set
    on: true
  occupied_set2:
    instanceOf: OccupiedSet2
    input: occupancy
    target: switch
    when: occupied == 0
    operation: set
    on: false
  people_counter:
    instanceOf: PeopleCounter
    bindings:
      count: count
    kind: people_counter
    device: simulated_device
    uid: people_counter
    value: "3"
